name: CI

on:
  push:
    branches:
      - front
      - main
  pull_request:
    branches:
      - front
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_USERS_URL: http://localhost:8000
          VITE_API_BOOKS_URL: http://localhost:8001
          VITE_API_LOANS_URL: http://localhost:8003
          VITE_API_RECO_URL: http://localhost:8004

  backend:
    name: Python compile checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - utilisateurs
          - livres
          - emprunts
          - reco
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - run: python -m compileall services/${{ matrix.service }}/app

  ml-scripts:
    name: ML scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
      - run: python -m compileall scripts

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: cp .env.example .env
      - run: docker compose --profile prod build

  integration:
    name: Compose smoke health
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - uses: actions/checkout@v4.2.2
      - run: cp .env.example .env
      - run: docker compose --profile prod up -d
      - name: Wait for service health endpoints
        run: |
          set -euo pipefail
          for port in 8000 8001 8003 8004; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://localhost:${port}/health" >/dev/null; then
                echo "Service healthy on port ${port}"
                break
              fi
              if [ "${attempt}" -eq 30 ]; then
                echo "Health check failed on port ${port}"
                docker compose --profile prod ps
                docker compose --profile prod logs
                exit 1
              fi
              sleep 5
            done
          done
      - if: always()
        run: docker compose --profile prod down -v
